name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify release tag matches package version
        run: >-
          python -c "import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v');
          assert tag == version, f'Release tag {tag!r} does not match package version {version!r}'"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Install and smoke-test wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import petrophys; from petrophys.io import read_las; from petrophys.workflow import run_dynamic_workflow; well = read_las(petrophys.sample('1046123714')); result = run_dynamic_workflow(well); assert not result.errors, result.errors; assert result.steps_executed"

      - name: Verify required wheel resources
        run: >-
          python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0];
          names = set(zipfile.ZipFile(wheel).namelist());
          required = {'petrophys/visualization/style.py',
          'petrophys/preprocessing/imputation/impute.py'};
          forbidden = {'petrophys/_internal/validators.py',
          'petrophys/io/example_format_export.py', 'petrophys/workflow/workflow_api.py'};
          missing = required - names; retired = forbidden & names;
          assert not missing, f'Missing wheel resources: {sorted(missing)}';
          assert not retired, f'Retired modules in wheel: {sorted(retired)}';
          assert not any(n.startswith(('tests/', 'docs/', 'examples/')) for n in names)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
