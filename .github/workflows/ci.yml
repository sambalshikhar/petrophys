name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint with flake8
        run: |
          flake8 src/petrophys --count --select=E9,F63,F7,F82 --builtins=Well,Curve --show-source --statistics
          flake8 src/petrophys --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Check the declared parameters of the public functions
        run: python scripts/check_function_schema.py

      - name: Type-check the public API modules with mypy
        # numpy's stubs need a Python 3.12+ interpreter; the files are listed
        # in pyproject.toml ([tool.mypy] files).
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Check scientific inputs and diagnostic plots
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/check_input_validation.py
          python scripts/check_diagnostic_plots.py

  tutorials:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tutorial runtime
        run: python -m pip install -e ".[tutorials,mcp]"
      - name: Execute user-journey notebooks in fresh kernels
        run: python scripts/execute_tutorials.py --output-dir tutorial-results --report tutorial-results/report.json
      - name: Upload executed notebooks and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-tutorials-${{ matrix.os }}
          path: tutorial-results/

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,tutorials,dev]"

      - name: Execute imputation tutorials
        env:
          MPLBACKEND: Agg
        run: >-
          python scripts/execute_tutorials.py
          examples/part_b_advanced/13_ml_curve_imputation.ipynb
          examples/case_studies/cs4_imperfect_well_recovery_16_7-1.ipynb
          --output-dir tutorial-results

  dlis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dlis,tutorials,dev]"

      - name: Verify fixture availability
        run: >-
          python -c "from petrophys.datasets import integration_fixture;
          names = ('daydream1_deep_pex_aps_ppc_ecs.dlis',
          'daydream1_fmi_processed_dynamic_image.dlis');
          assert all(integration_fixture(n).stat().st_size > 1024 for n in names)"

      - name: Execute native borehole-image tutorial
        env:
          MPLBACKEND: Agg
        run: python scripts/execute_tutorials.py examples/part_b_advanced/16_borehole_image_fmi.ipynb --output-dir tutorial-results

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,mcp]"

      - name: Check saved notebook outputs are fresh and portable
        run: python scripts/check_notebook_outputs.py

      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build and check distributions
        run: |
          python -m build
          twine check dist/*

      - name: Install and smoke-test wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import petrophys; from petrophys.io import read_las; from petrophys.workflow import run_dynamic_workflow; well = read_las(petrophys.sample('1046123714')); result = run_dynamic_workflow(well); assert not result.errors, result.errors; assert result.steps_executed"

      - name: Verify required wheel resources
        run: >-
          python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0];
          names = set(zipfile.ZipFile(wheel).namelist());
          required = {'petrophys/visualization/style.py',
          'petrophys/preprocessing/imputation/impute.py'};
          forbidden = {'petrophys/_internal/validators.py',
          'petrophys/io/example_format_export.py', 'petrophys/workflow/workflow_api.py'};
          missing = required - names; retired = forbidden & names;
          assert not missing, f'Missing wheel resources: {sorted(missing)}';
          assert not retired, f'Retired modules in wheel: {sorted(retired)}';
          assert not any(n.startswith(('tests/', 'docs/', 'examples/')) for n in names)"
