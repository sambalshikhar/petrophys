name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          flake8 src/petrophys tests --count --select=E9,F63,F7,F82 --builtins=Well,Curve --show-source --statistics
          flake8 src/petrophys tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Run tests with pytest
        run: |
          pytest --cov=petrophys --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  user-journeys:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Exercise optional geology and public API journeys
        run: python -m pytest tests/test_usability_workflows.py tests/test_input_templates.py tests/test_core_saturation_units.py

  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tutorial runtime
        run: python -m pip install -e ".[tutorials]"
      - name: Execute user-journey notebooks in fresh kernels
        run: python scripts/execute_tutorials.py --output-dir tutorial-results --report tutorial-results/report.json
      - name: Upload executed notebooks and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-tutorials
          path: tutorial-results/

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Run pretrained-model tests
        run: |
          pytest tests/test_curve_imputation.py \
            tests/test_critical_findings_regressions.py::test_curve_feature_transformer_follows_sklearn_clone_contract \
            tests/test_critical_findings_regressions.py::test_model_pack_dependency_series_are_enforced \
            tests/test_critical_findings_regressions.py::test_training_metrics_are_grouped_by_well \
            tests/test_cutoff_standards.py::test_pretrained_imputer_pack_loads_without_legacy_namespaces

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build and check distributions
        run: |
          python -m build
          twine check dist/*

      - name: Verify required wheel resources
        run: >-
          python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0];
          names = set(zipfile.ZipFile(wheel).namelist());
          required = {'petrophys/_internal/data/electrofacies_v1.json.gz',
          'petrophys/preprocessing/imputation/pretrained/geolink_curve_imputation.joblib'};
          forbidden = {'petrophys/_internal/validators.py',
          'petrophys/io/example_format_export.py', 'petrophys/workflow/workflow_api.py'};
          missing = required - names; retired = forbidden & names;
          assert not missing, f'Missing wheel resources: {sorted(missing)}';
          assert not retired, f'Retired modules in wheel: {sorted(retired)}'"
