name: Release artifact verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel through the source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-dist
          path: dist/

  installed-artifacts:
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        artifact: [wheel, sdist]
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
      ARTIFACT_KIND: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-dist
          path: dist/
      - name: Install and test artifact outside source checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          root = Path.cwd()
          pattern = "*.whl" if os.environ["ARTIFACT_KIND"] == "wheel" else "*.tar.gz"
          artifact, = list((root / "dist").glob(pattern))
          clean = dict(os.environ)
          clean.pop("PYTHONPATH", None)
          with tempfile.TemporaryDirectory() as work:
              subprocess.run([sys.executable, "-m", "pip", "install", str(artifact)], check=True, cwd=work, env=clean)
              subprocess.run([sys.executable, "-m", "pip", "check"], check=True, cwd=work, env=clean)
              subprocess.run([sys.executable, str(root / "scripts/verify_installed_release.py"),
                              "--artifact", str(artifact), "--report", str(root / "installed-report.json")],
                             check=True, cwd=work, env=clean)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.artifact }}
          path: installed-report.json

  tested-candidate:
    needs: [candidate, installed-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tested-dist
          path: dist/
      # No upload to a package index. Scientific, dataset, docs/figure,
      # security and redistribution approval are additional release gates.
