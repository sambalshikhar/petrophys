[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petrophys"
version = "3.0.0"
description = "A comprehensive petrophysics library for well log analysis and formation evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_DATA.md"]
requires-python = ">=3.9"
authors = [
    {name = "Petrophys Contributors"}
]
keywords = [
    "petrophysics",
    "well-log",
    "formation-evaluation",
    "porosity",
    "saturation",
    "permeability",
    "oil-gas",
    "geoscience"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "lasio>=0.30",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dlis = ["dlisio>=0.3.0"]
ml = [
    "scikit-learn>=1.8.0,<1.9.0",
    "joblib>=1.5.0,<1.6.0",
    "xgboost>=3.2.0,<3.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
tutorials = [
    "nbformat>=5.7",
    "nbclient>=0.8",
    "ipykernel>=6.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-nb>=1.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.5.0",
]
all = [
    "dlisio>=0.3.0",
    "scikit-learn>=1.8.0,<1.9.0",
    "joblib>=1.5.0,<1.6.0",
    "xgboost>=3.2.0,<3.3.0",
]

[project.urls]
Homepage = "https://github.com/sambalshikhar/petrophys"
Documentation = "https://petrophys.readthedocs.io"
Repository = "https://github.com/sambalshikhar/petrophys"
Issues = "https://github.com/sambalshikhar/petrophys/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["petrophys*"]

[tool.setuptools.package-data]
petrophys = [
    "py.typed",
    "preprocessing/imputation/pretrained/*.joblib",
    "preprocessing/imputation/pretrained/*.json",
    "visualization/templates/*.xml",
    "datasets/*.csv",
    "datasets/*.md",
    "datasets/costa/*.las",
    "datasets/costa/*.md",
    "datasets/daydream/*.md",
    "datasets/daydream/daydream1_cmr.las",
    "datasets/daydream/daydream1_cmr_shallow.las",
    "datasets/geolink/*.las",
    "datasets/geolink/*.md",
    "datasets/kgs/*.las",
    "datasets/kgs/*.csv",
    "datasets/kgs/*.md",
    "datasets/kgs/*.txt",
    "_internal/data/*.json.gz",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Keep default invocation (`pytest`) working without the optional pytest-cov.
# Run coverage explicitly, e.g.:
#   pytest --cov=petrophys --cov-report=term-missing
addopts = "-ra"
