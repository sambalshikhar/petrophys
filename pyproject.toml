[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petrophys"
version = "3.0.0"
description = "A comprehensive petrophysics library for well log analysis and formation evaluation"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_DATA.md",
    "ACKNOWLEDGEMENTS.md",
    "src/petrophys/datasets/phillips/LICENSE-*.txt",
    "src/petrophys/datasets/taranaki/LICENSE-*.txt",
]
requires-python = ">=3.10"
authors = [
    {name = "Petrophys Contributors"}
]
keywords = [
    "petrophysics",
    "well-log",
    "formation-evaluation",
    "porosity",
    "saturation",
    "permeability",
    "oil-gas",
    "geoscience"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "lasio>=0.30",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dlis = ["dlisio>=0.3.0"]
# Curve imputation (pp.impute) and K-means electrofacies.
ml = ["scikit-learn>=1.2"]
dev = [
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
# MCP server for LLM clients (Claude Desktop, Claude Code, Cursor, ...).
mcp = ["mcp>=2.2,<3; python_version >= '3.10'"]
tutorials = [
    "nbformat>=5.7",
    "nbclient>=0.8",
    "ipykernel>=6.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-nb>=1.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.5.0",
    "scikit-learn>=1.2",
]
all = [
    "dlisio>=0.3.0",
    "mcp>=2.2,<3; python_version >= '3.10'",
    "scikit-learn>=1.2",
]

[project.urls]
Homepage = "https://welllogbench.com/petrophys/"
Documentation = "https://welllogbench.com/petrophys/docs/"
Repository = "https://github.com/sambalshikhar/petrophys"
Issues = "https://github.com/sambalshikhar/petrophys/issues"

[project.scripts]
petrophys-mcp = "petrophys.mcp:main"
petrophys-context = "petrophys.reporting.context_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["petrophys*"]

[tool.setuptools.package-data]
petrophys = [
    "py.typed",
    "visualization/templates/*.xml",
    "_internal/data/*.csv",
    "datasets/*.csv",
    "datasets/*.md",
    "datasets/costa/*.las",
    "datasets/costa/*.md",
    "datasets/daydream/*.md",
    "datasets/daydream/daydream1_cmr.las",
    "datasets/daydream/daydream1_cmr_shallow.las",
    "datasets/geolink/*.las",
    "datasets/geolink/*.md",
    "datasets/epslog/*.las",
    "datasets/epslog/*.csv",
    "datasets/epslog/*.json",
    "datasets/epslog/*.md",
    "datasets/formation_pressure/*.las",
    "datasets/formation_pressure/*.DLIS",
    "datasets/formation_pressure/*.md",
    "datasets/kgs/*.las",
    "datasets/kgs/*.csv",
    "datasets/kgs/*.md",
    "datasets/kgs/*.txt",
    "datasets/phillips/*.csv",
    "datasets/phillips/*.xlsx",
    "datasets/phillips/*.json",
    "datasets/phillips/*.md",
    "datasets/phillips/*.txt",
    "datasets/taranaki/*.las",
    "datasets/taranaki/*.csv",
    "datasets/taranaki/*.md",
    "datasets/taranaki/*.txt",
    "datasets/teapot/*.las",
    "datasets/teapot/*.md",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
# The whole package is type-checked in CI. The modules listed under the
# override below still have errors and are skipped; take a module off the
# list once it passes. A new module is checked from the start.
files = ["src/petrophys"]
follow_imports = "silent"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

