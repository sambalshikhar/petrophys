[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petrophys"
version = "0.1.0"
description = "A comprehensive petrophysics library for well log analysis and formation evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Petrophysics Team", email = "petrophys@example.com"}
]
keywords = [
    "petrophysics",
    "well-log",
    "formation-evaluation",
    "porosity",
    "saturation",
    "permeability",
    "oil-gas",
    "geoscience"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "lasio>=0.30",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dlis = ["dlisio>=0.3.0"]
ml = [
    "scikit-learn>=1.1.0",
    "joblib>=1.2.0",
    "xgboost>=1.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.18.0",
    "numpydoc>=1.4.0",
]
all = ["petrophys[dlis,dev,docs,ml]"]

[project.urls]
Homepage = "https://github.com/petrophys/petrophys"
Documentation = "https://petrophys.readthedocs.io"
Repository = "https://github.com/petrophys/petrophys"
Issues = "https://github.com/petrophys/petrophys/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["petrophys*"]

[tool.setuptools.package-data]
petrophys = [
    "py.typed",
    "imputation/pretrained/*.joblib",
    "visualization/templates/*.xml",
    "data/*.csv",
    "data/*.md",
    "data/costa/*.las",
    "data/daydream/*.las",
    "data/geolink/*.las",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Keep default invocation (`pytest`) working without the optional pytest-cov.
# Run coverage explicitly, e.g.:
#   pytest --cov=petrophys --cov-report=term-missing
addopts = "-ra"
